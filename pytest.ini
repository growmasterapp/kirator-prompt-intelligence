[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
timeout = 300
markers =
    unit: Fast tests with no Ollama / network
    api: Flask HTTP API tests
    gui: Browser UI tests (Playwright)
    pipeline: Full LLM pipeline tests (requires Ollama)
    overnight: Included in the overnight ship-readiness battery
    e2e: End-to-end tests that exercise a live pipeline run
filterwarnings =
    ignore::DeprecationWarning
